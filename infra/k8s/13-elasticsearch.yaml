# Single-node, security disabled — local-cluster stand-in for the
# managed OpenSearch domain phase 11's Terraform provisions on real
# AWS, same role dynamodb-local/sqs play for DynamoDB/SQS. Structured
# logs from all three services ship here (see logsink/, wired in via
# ELASTICSEARCH_ENDPOINT in 01-config.yaml) in addition to each pod's
# own stdout, which `kubectl logs` keeps reading unchanged either way.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticsearch
  namespace: reward-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: elasticsearch
  template:
    metadata:
      labels:
        app: elasticsearch
    spec:
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
          env:
            - name: discovery.type
              value: single-node
            - name: xpack.security.enabled
              value: "false"
            - name: ES_JAVA_OPTS
              value: "-Xms512m -Xmx512m"
          ports:
            - containerPort: 9200
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /_cluster/health
              port: 9200
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: reward-platform
spec:
  selector:
    app: elasticsearch
  ports:
    - port: 9200
      targetPort: 9200
