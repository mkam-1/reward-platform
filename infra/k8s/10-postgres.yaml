# Single-replica, no PVC: this is the local-dev stand-in for RDS, same
# role docker-compose's postgres container plays. A StatefulSet + PVC
# would be the real move for a self-hosted Postgres in prod; here the
# point is exercising k8s itself, not re-deriving a managed database.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: reward-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: reward-platform-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: reward-platform-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: reward-platform-config
                  key: POSTGRES_DB
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "reward"]
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: reward-platform
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
