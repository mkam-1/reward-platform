include classpath("application.conf")

// By default ElasticMQ stamps queue URLs it returns (from CreateQueue)
// with whatever host/port it thinks it's reachable at — which defaults
// to localhost, wrong for anything calling it from another container on
// the Docker network. This pins it to the service name docker-compose
// gives this container ("sqs"), so URLs other services get back are
// actually resolvable from inside the network.
node-address {
    protocol = http
    host = "sqs"
    port = 9324
    context-path = ""
}

rest-sqs {
    enabled = true
    bind-port = 9324
    bind-hostname = "0.0.0.0"
}
