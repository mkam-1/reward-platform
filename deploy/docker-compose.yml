services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: reward
      POSTGRES_PASSWORD: reward
      POSTGRES_DB: reward_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reward -d reward_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  player-service:
    build:
      context: ..
      dockerfile: services/player-service/Dockerfile
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://reward:reward@postgres:5432/reward_platform?sslmode=disable"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
