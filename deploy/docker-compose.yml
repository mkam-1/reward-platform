services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Host-side 5433, not 5432: this machine already has a native
      # PostgreSQL install bound to 5432. Only the host-facing side
      # changes — player-service talks to this container over the
      # internal Docker network as "postgres:5432" regardless.
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  dynamodb-local:
    image: amazon/dynamodb-local:latest
    ports:
      - "8000:8000"

  # ElasticMQ is a free, open-source SQS-compatible emulator — the first
  # choice here was LocalStack, but its `:latest` image now gates SQS
  # (and everything else) behind a paid license/auth token it checks for
  # on startup, even for services that used to be free. ElasticMQ has no
  # such gate. elasticmq.conf pins the queue-URL hostname it hands back
  # to "sqs" (this service's Docker-network name) instead of its default
  # of "localhost", which would be unreachable from any other container.
  sqs:
    image: softwaremill/elasticmq-native:latest
    volumes:
      - ./elasticmq.conf:/opt/elasticmq.conf
    ports:
      - "9324:9324"

  # Single-node, security disabled — local-dev stand-in for the managed
  # OpenSearch domain phase 11's Terraform provisions on real AWS, same
  # relationship DynamoDB Local has to real DynamoDB. Structured logs
  # from all three services ship here (see logsink/, wired in via
  # ELASTICSEARCH_ENDPOINT below) in addition to each container's own
  # stdout, so `docker compose logs` keeps working unchanged either way.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  player-service:
    build:
      context: ..
      dockerfile: services/player-service/Dockerfile
    environment:
      PORT: "8080"
      GRPC_PORT: "9090"
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
      SQS_ENDPOINT: "http://sqs:9324"
      SESSION_COMPLETED_QUEUE: "session-completed"
      POINTS_AWARDED_QUEUE: "points-awarded"
      ELASTICSEARCH_ENDPOINT: "http://elasticsearch:9200"
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
    ports:
      - "8080:8080"
      - "9090:9090"
    depends_on:
      postgres:
        condition: service_healthy
      sqs:
        condition: service_started
      elasticsearch:
        condition: service_healthy
    # ElasticMQ has no built-in healthcheck endpoint this minimal image
    # can run, so "sqs: condition: service_started" above only waits for
    # the container to start, not for it to actually accept connections
    # yet — a real (if small) race. restart: on-failure covers that gap:
    # if EnsureQueue loses that race on first boot, the container exits
    # and Docker restarts it, which succeeds once ElasticMQ is actually
    # ready — in practice converges within a second or two.
    restart: on-failure:5

  game-service:
    build:
      context: ..
      dockerfile: services/game-service/Dockerfile
    environment:
      PORT: "8080"
      SQS_ENDPOINT: "http://sqs:9324"
      SESSION_COMPLETED_QUEUE: "session-completed"
      ELASTICSEARCH_ENDPOINT: "http://elasticsearch:9200"
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
    ports:
      - "8081:8080"
    depends_on:
      sqs:
        condition: service_started
      elasticsearch:
        condition: service_healthy
    restart: on-failure:5

  rewards-service:
    build:
      context: ..
      dockerfile: services/rewards-service/Dockerfile
    environment:
      PORT: "8080"
      DYNAMODB_ENDPOINT: "http://dynamodb-local:8000"
      DYNAMODB_TABLE: "reward_platform"
      SQS_ENDPOINT: "http://sqs:9324"
      POINTS_AWARDED_QUEUE: "points-awarded"
      PLAYER_SERVICE_GRPC_ADDR: "player-service:9090"
      ELASTICSEARCH_ENDPOINT: "http://elasticsearch:9200"
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
    ports:
      - "8082:8080"
    depends_on:
      sqs:
        condition: service_started
      player-service:
        condition: service_started
      elasticsearch:
        condition: service_healthy
    restart: on-failure:5

volumes:
  postgres-data:
